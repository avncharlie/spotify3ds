name: Setup wizard

on:
  workflow_dispatch:
  push:
    paths:
      - "cmd/spotify3ds-setup/**"
      - "internal/setupoauth/**"
      - "internal/setupqr/**"
      - "assets/embed.go"
      - "assets/setup-dev-dashboard-tutorial/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/setup-wizard.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x64
            binary: Spotify3DS-Setup
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            binary: Spotify3DS-Setup
          - runner: windows-2025
            artifact: windows-x64
            binary: Spotify3DS-Setup.exe
          - runner: windows-11-arm
            artifact: windows-arm64
            binary: Spotify3DS-Setup.exe
          - runner: macos-15-intel
            artifact: macos-x64
            binary: Spotify3DS-Setup
          - runner: macos-15
            artifact: macos-arm64
            binary: Spotify3DS-Setup
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/spotify3ds-setup
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify3DS-Setup-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
