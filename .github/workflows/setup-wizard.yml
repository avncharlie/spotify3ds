name: Setup wizard

on:
  workflow_dispatch:
  push:
    paths:
      - "cmd/spotify3ds-setup/**"
      - "internal/setupoauth/**"
      - "internal/setupqr/**"
      - "assets/embed.go"
      - "assets/icon-setup-1024.png"
      - "assets/setup-dev-dashboard-tutorial/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/setup-wizard.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x64
            binary: Spotify3DS-Setup
          - runner: ubuntu-22.04-arm
            artifact: linux-arm64
            binary: Spotify3DS-Setup
          - runner: windows-2025
            artifact: windows-x64
            binary: Spotify3DS-Setup.exe
          - runner: windows-11-arm
            artifact: windows-arm64
            binary: Spotify3DS-Setup.exe
          - runner: macos-15-intel
            artifact: macos-x64
            binary: Spotify3DS-Setup
          - runner: macos-15
            artifact: macos-arm64
            binary: Spotify3DS-Setup
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install Windows ARM64 C toolchain
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $version = "20260616"
          $package = "llvm-mingw-$version-ucrt-aarch64"
          $archive = Join-Path $env:RUNNER_TEMP "$package.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$package.zip" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba") {
            throw "Unexpected llvm-mingw archive checksum: $hash"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "$package/bin"
          if (-not (Test-Path "$bin/aarch64-w64-mingw32-clang.exe")) {
            throw "llvm-mingw layout is missing the ARM64 compiler"
          }
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$bin/aarch64-w64-mingw32-clang.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$bin/aarch64-w64-mingw32-clang++.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/spotify3ds-setup
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify3DS-Setup-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
